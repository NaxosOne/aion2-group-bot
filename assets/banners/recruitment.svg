<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Recrutement">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160b34"/>
      <stop offset="1" stop-color="#7b45d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.17" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#e7d9ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e7d9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f0ff"/>
      <stop offset="1" stop-color="#b79af0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#glow)"/>

  <!-- Winged crest, centred on x=160. Smooth top edge, feather-scalloped underside. -->
  <g fill="url(#wing)" stroke="#2a1553" stroke-width="2" stroke-linejoin="round" opacity="0.95">
    <!-- right wing -->
    <path d="M160 186
             C 190 150, 226 128, 270 117
             C 259 130, 251 139, 247 151
             C 259 149, 269 151, 277 157
             C 259 159, 241 161, 227 167
             C 237 168, 245 172, 251 180
             C 233 179, 213 183, 199 187
             C 207 190, 213 194, 217 200
             C 199 197, 178 193, 160 186 Z"/>
    <!-- left wing (mirror of the right across x=160) -->
    <path d="M160 186
             C 130 150, 94 128, 50 117
             C 61 130, 69 139, 73 151
             C 61 149, 51 151, 43 157
             C 61 159, 79 161, 93 167
             C 83 168, 75 172, 69 180
             C 87 179, 107 183, 121 187
             C 113 190, 107 194, 103 200
             C 121 197, 142 193, 160 186 Z"/>
  </g>

  <!-- Central celestial gem. -->
  <g stroke="#2a1553" stroke-width="2" stroke-linejoin="round">
    <path d="M160 122 L178 152 L160 182 L142 152 Z" fill="url(#wing)"/>
    <path d="M160 122 L160 182 M142 152 L178 152" stroke="#2a1553" stroke-width="1.5" opacity="0.4"/>
  </g>
  <circle cx="160" cy="152" r="34" fill="none" stroke="#f3ecff" stroke-width="2" opacity="0.35"/>

  <text x="960" y="150" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" fill="#efe6ff">RECRUTEMENT</text>
  <text x="960" y="200" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#efe6ff" opacity="0.75" letter-spacing="6">KISK</text>
</svg>
