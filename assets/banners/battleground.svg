<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Battleground">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="1" stop-color="#b5561f"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="300" fill="url(#bg)"/>
  <g opacity="0.18" fill="#000000">
    <polygon points="70,60 120,60 120,200 95,180 70,200"/>
    <polygon points="150,80 200,80 200,220 175,200 150,220"/>
    <rect x="66" y="52" width="140" height="14"/>
  </g>
  <g stroke="#000000" stroke-width="10" opacity="0.15">
    <line x1="40" y1="250" x2="260" y2="250"/>
  </g>
  <text x="960" y="150" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="#ffe6d2">BATTLEGROUND</text>
  <text x="960" y="200" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#ffe6d2" opacity="0.75" letter-spacing="6">KISK</text>
</svg>
