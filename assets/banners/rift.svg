<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Rift">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06232b"/>
      <stop offset="1" stop-color="#3a1f6e"/>
    </linearGradient>
    <radialGradient id="portal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8be8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8be8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="300" fill="url(#bg)"/>
  <g transform="translate(150 150)">
    <circle r="120" fill="url(#portal)"/>
    <g fill="none" stroke="#bfe9ff" stroke-width="4" opacity="0.4">
      <ellipse rx="110" ry="70"/>
      <ellipse rx="80" ry="50" transform="rotate(30)"/>
      <ellipse rx="50" ry="30" transform="rotate(60)"/>
    </g>
  </g>
  <text x="960" y="150" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" fill="#d7f3ff">RIFT</text>
  <text x="960" y="200" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#d7f3ff" opacity="0.75" letter-spacing="6">KISK</text>
</svg>
