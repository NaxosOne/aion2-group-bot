<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffb59a"/><stop offset="100%" stop-color="#c1272d"/>
  </linearGradient></defs>
  <g transform="rotate(-32 64 64)">
    <!-- shaft -->
    <rect x="55" y="50" width="18" height="76" rx="8"
          fill="#8a5326" stroke="#3a1a0c" stroke-width="7"/>
    <!-- crossguard -->
    <rect x="34" y="46" width="60" height="13" rx="6"
          fill="#8a5326" stroke="#3a1a0c" stroke-width="7"/>
    <!-- spear blade -->
    <polygon points="64,2 82,30 79,52 49,52 46,30"
             fill="url(#g)" stroke="#3a1a0c" stroke-width="7" stroke-linejoin="round"/>
    <line x1="64" y1="14" x2="64" y2="48" stroke="#ffe2d6" stroke-width="5" opacity="0.8"/>
  </g>
</svg>
