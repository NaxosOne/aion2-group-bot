  <polygon points="1105,90 1110,108 1128,113 1110,118 1105,136 1100,118 1082,113 1100,108" fill="#fdf3d5" opacity="0.9"/>
  <polygon points="500,330 503,341 514,344 503,347 500,358 497,347 486,344 497,341" fill="#cdf6ff" opacity="0.8"/>

  <!-- winged crystal, left side -->
  <g transform="translate(60,40) scale(0.83)">
    <circle cx="256" cy="240" r="120" fill="#37c8f0" opacity="0.3" filter="url(#blurB)"/>
    <g fill="#f7f2e6">
