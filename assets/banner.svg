<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <defs>
    <radialGradient id="bgB" cx="38%" cy="45%" r="95%">
      <stop offset="0%" stop-color="#1c2a63"/>
      <stop offset="55%" stop-color="#101a44"/>
      <stop offset="100%" stop-color="#060c22"/>
    </radialGradient>
    <linearGradient id="gemLB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bff7ff"/>
      <stop offset="100%" stop-color="#46cbee"/>
    </linearGradient>
    <linearGradient id="gemRB" x1="1" y1="0" x2="0" y2="1">
