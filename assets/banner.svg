    <circle cx="220" cy="46" r="1.8" opacity="0.6"/>
    <circle cx="540" cy="60" r="2" opacity="0.7"/>
    <circle cx="760" cy="42" r="2.4" opacity="0.8"/>
    <circle cx="980" cy="74" r="1.8" opacity="0.6"/>
