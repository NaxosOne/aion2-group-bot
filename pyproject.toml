[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kisk"
version = "0.3.1"
description = "Discord bot to organise Aion 2 legion parties"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "discord.py>=2.4,<3",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.5"]

[project.scripts]
kisk = "bot.main:main"

[tool.setuptools]
packages = ["bot", "bot.cogs", "bot.utils"]

[tool.ruff]
line-length = 88
target-version = "py311"
# Design docs may contain illustrative (not necessarily formatted) code blocks.
extend-exclude = ["docs"]

# The codebase is `ruff format`-normalised and passes this set:
#   E  pycodestyle (incl. line length), F pyflakes, I import sorting,
#   B  flake8-bugbear, UP pyupgrade.
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
